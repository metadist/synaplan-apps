# Gate 2 (Click) — app-owned Server settings overlay (Epic 3 §3.0).
#
# The gear opens the native Server overlay; it must show the Save/Cancel actions and
# be dismissable without changing anything. All anchors are app-owned English strings
# from app/synaplan-native.js (not SPA/locale text), so this is robust across servers.
appId: ${APP_ID}
env:
  APP_ID: com.synaplan.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Server settings'
    timeout: 25000
- tapOn: 'Server settings'
- assertVisible: 'Save'
- assertVisible: 'Cancel'
- assertVisible: 'Reset to default'
- tapOn: 'Cancel'
- assertNotVisible: 'Save'
- takeScreenshot: artifacts/02-server-settings
