name: Mobile Release Drill

# ci.yml only runs on pull requests, so a merged submodule sync is the first
# state nothing verifies. The push trigger closes that gap; the weekly schedule
# stays as the heartbeat for decay that happens without a commit here, such as
# runner image updates or a pin whose tag ages out of a shallow fetch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: mobile-release-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: Exercise release routing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # A shallow checkout fetches the submodule with --depth=1 and, once the
          # pin is no longer the tip of synaplan/main, without any tags. The drift
          # check then cannot resolve the documented release tag.
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run ci-local

      - name: Check the recorded release state
        run: npm run check:release

      - name: Run non-publishing release drill
        run: node scripts/release-drill.mjs | tee release-drill.txt

      - name: Upload drill report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-drill-${{ github.run_id }}
          path: release-drill.txt
          if-no-files-found: error
          retention-days: 30
