name: Mobile Release Drill

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

concurrency:
  group: mobile-release-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: Exercise release routing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run ci-local

      - name: Run non-publishing release drill
        run: node scripts/release-drill.mjs | tee release-drill.txt

      - name: Upload drill report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-drill-${{ github.run_id }}
          path: release-drill.txt
          if-no-files-found: error
          retention-days: 30
