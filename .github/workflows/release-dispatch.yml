name: Mobile Release Dispatch

# Runs after an automated synchronization pull request merges and routes the
# release. The route is read from the file that sync-synaplan.yml wrote from the
# attested source manifest, so no classification is re-derived here.

on:
  push:
    branches: [main]
    paths: ['.github/release-route.json']

concurrency:
  group: mobile-release-dispatch
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  route:
    name: Read the recorded release route
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.route.outputs.classification }}
      tag: ${{ steps.route.outputs.tag }}
      skip: ${{ steps.duplicate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Verify the route against the pinned submodule
        id: route
        run: node scripts/release-route.mjs --verify >> "$GITHUB_OUTPUT"

      - name: Skip a duplicate delivery of the same commit
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Auto-merge can deliver two push events for the same squash commit.
          # concurrency queues the second run behind the first, so once the
          # first run succeeds the second would rebuild the same commit count
          # and fail at TestFlight with a duplicate CFBundleVersion.
          prior_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-dispatch.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .conclusion == \"success\")] | first | .id // empty"
          )"
          if test -n "$prior_run"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit \`${GITHUB_SHA}\` was already delivered by run \`${prior_run}\`; skipping duplicate dispatch." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the route
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          echo "Routing \`${{ steps.route.outputs.tag }}\` as \`${{ steps.route.outputs.classification }}\`." \
            >> "$GITHUB_STEP_SUMMARY"

  ota:
    name: Publish over the air
    needs: route
    if: needs.route.outputs.skip != 'true' && needs.route.outputs.classification == 'ota-candidate'
    uses: ./.github/workflows/ota.yml
    with:
      operation: publish
      class: ota-candidate
      channel: production
      dry_run: false
    secrets: inherit

  health:
    name: Watch the published bundle
    needs: [route, ota]
    if: needs.route.outputs.skip != 'true' && needs.route.outputs.classification == 'ota-candidate'
    uses: ./.github/workflows/ota-health.yml
    with:
      channel: production
      bundle_version: ${{ needs.ota.outputs.bundle_version }}
      rollback_to: ${{ needs.ota.outputs.previous_bundle_version }}
    secrets: inherit

  store:
    name: Build a store release candidate
    needs: route
    if: needs.route.outputs.skip != 'true' && needs.route.outputs.classification == 'store-required'
    uses: ./.github/workflows/store-rc.yml
    with:
      dry_run: false
    secrets: inherit
